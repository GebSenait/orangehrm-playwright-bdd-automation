name: OrangeHRM Automation CI

on:
  push:
    branches: [ main, task-dev-demo ]
  pull_request:
    branches: [ main, task-dev-demo ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright system dependencies
      run: |
        sudo apt-get update
        # Install all required system dependencies for Playwright Chromium
        # Handle Ubuntu 24.04+ package name changes (libasound2 -> libasound2t64)
        # Try installing libasound2t64 first (Ubuntu 24.04+), fallback to libasound2 (older versions)
        if sudo apt-get install -y libasound2t64 2>/dev/null; then
          echo "Installed libasound2t64 (Ubuntu 24.04+)"
        else
          sudo apt-get install -y libasound2 2>/dev/null || echo "libasound2/libasound2t64 installation skipped"
        fi
        # Install remaining Playwright dependencies
        sudo apt-get install -y \
          libnss3 \
          libatk-bridge2.0-0 \
          libatk1.0-0 \
          libatspi2.0-0 \
          libcups2 \
          libdbus-1-3 \
          libdrm2 \
          libgbm1 \
          libgtk-3-0 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libxshmfence1 \
          libxss1 \
          fonts-liberation \
          libappindicator3-1 \
          xdg-utils || true
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
    
    - name: Run Behave tests
      run: |
        behave features/ --junit --junit-directory test-results
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30
    
    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots
        path: screenshots/
        retention-days: 30

