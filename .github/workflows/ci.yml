name: OrangeHRM Automation CI

on:
  push:
    branches: [ main, task-dev-demo ]
  pull_request:
    branches: [ main, task-dev-demo ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright system dependencies
      run: |
        sudo apt-get update
        # Fix for Ubuntu 24.04+ where libasound2 package name changed to libasound2t64
        # Try installing the new package name first, fallback to old name for older Ubuntu versions
        sudo apt-get install -y libasound2t64 2>/dev/null || sudo apt-get install -y libasound2 2>/dev/null || true
        # Install remaining Playwright system dependencies
        playwright install-deps chromium
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
    
    - name: Run Behave tests
      run: |
        behave features/ --junit --junit-directory test-results
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30
    
    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots
        path: screenshots/
        retention-days: 30

